acceptance: []
description: 通用任务模板
keywords: []
name: task
states:
- pending
- in_progress
- completed
structure: "# {{ id }}\n\n## ⚠️ 重要提示（Agent 必读）\n\n**当前位置**: `.long-run-agent/tasks/{{id}}.md`（任务描述文件）\n\
  \n**工作目录**: 项目根目录（`.long-run-agent` 的同级目录）\n\n**产出物**: 请在项目根目录或适当子目录创建交付物\n\n**这是配置文件**，不是最终产出！\n\
  \n## 描述\n\n{{ description }}\n\n## 交付物\n\n<!-- 请列出交付物 -->\n\n## 验证证据（完成前必填）\n\n\
  <!-- 标记完成前，请提供以下证据： -->\n\n- [ ] **实现证明**: 简要说明如何实现\n- [ ] **测试验证**: 如何验证功能正常（测试步骤/截图/命令输出）\n\
  - [ ] **影响范围**: 是否影响其他功能\n\n### 测试步骤\n1. \n2. \n3. \n\n### 验证结果\n<!-- 粘贴验证截图、命令输出或测试结果\
  \ -->\n"
template_engine: jinja2
transitions:
  completed: []
  in_progress:
  - completed
  pending:
  - in_progress
validation:
  evidence_fields:
  - 实现证明
  - 测试验证
  - 影响范围
  required_for_completion:
    test_evidence: true
    verification_steps: true
version: '2.1'
